name = "household-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
TZ_OFFSET_MIN = "600"

# Every hour; each person picks the hour of their daily summary
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "household"
database_id = "9eb3523c-d3ee-4ab3-85e8-30cec7b8fa01"
migrations_dir = "migrations"

# Tandem's over the air updates, built by scripts/build-ota.mjs on every deploy.
[assets]
directory = "./ota-dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
