name = "household-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
TZ_OFFSET_MIN = "600"

# 7:00am Brisbane = 21:00 UTC the day before
[triggers]
crons = ["0 21 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "household"
