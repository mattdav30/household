name: Build Android app

# Builds a signed APK and attaches it to a GitHub release.
# Run it by hand from the Actions tab, or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Use the fixed signing key so every build installs over the last one
        run: cp signing/release.keystore android/app/debug.keystore
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Household.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Household ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          files: Household.apk
